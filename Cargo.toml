[package]
name = "the-finals-rng-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
vello_cpu = "0.2.0"
vello_common = "0.2.0"
skrifa = "0.44" # same as what vello uses
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "signal"] }
reqwest = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
eyre = "0.6.14"
futures = "0.3.34"
rand = "0.10.2"
serenity = { version = "0.12.5", features = ["collector"] }
webpki-root-certs = "1.0.9"
